name: Atualizar Cupons Mercado Livre
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths-ignore:
      - 'cupons.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Buscar cupons do Mercado Livre
        run: |
          pip install requests beautifulsoup4
          python -c '
          import requests, json, re
          from bs4 import BeautifulSoup
          cupons = []
          for url in ["https://t.me", "https://t.me"]:
              soup = BeautifulSoup(requests.get(url).text, "html.parser")
              for msg in soup.find_all("div", class_="tgme_widget_message_text"):
                  txt = msg.get_text(separator=" ").strip()
                  if "mercado livre" in txt.lower() and ("cupom" in txt.lower() or "off" in txt.lower()):
                      cods = [c for c in re.findall(r"\b[A-Z0-9]{5,15}\b", txt) if c not in ["MERCADO","LIVRE","CUPOM","AQUI","RESGATE","OFF","ACIMA","CORRE","APENAS","HTTPS"]]
                      a = msg.find("a")
                      cupons.append({"loja": "Mercado Livre", "descricao": txt[:200], "codigo": cods[0] if cods else "VER NA DESCRIÇÃO", "validade": "Capturado automaticamente", "link": a["href"] if a else "https://mercadolivre.com.br"})
          unicos = list({c["descricao"]: c for c in reversed(cupons)}.values())
          with open("cupons.json", "w", encoding="utf-8") as f:
              json.dump(unicos, f, ensure_ascii=False, indent=2)
          print(f"Sucesso: {len(unicos)} cupons salvos!")
          '
      - name: Salvar cupons atualizados
        run: |
          git config user.name "Bot Cupons ML"
          git config user.email "bot@://github.com"
          git add cupons.json
          git commit -m "Atualiza cupons ML" || exit 0
          git push
          
