name: Atualizar Cupons ML

on:
  schedule:
    # Roda automaticamente a cada 1 hora
    - cron: '0 * * * *'
  # Permite rodar manualmente clicando em um botão na aba Actions
  workflow_dispatch:

jobs:
  buscar-cupons:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          pip install requests beautifulsoup4

      - name: Rodar script de cupons
        run: python buscar_cupons.py

      - name: Salvar cupons atualizados no GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Atualizando cupons" || exit 0
          git push
          
